<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                ShopEasy
            </div>

            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#about">About</a></li>
            </ul>

            <button class="cart-btn" onclick="openCart()">
                🛒 Cart
                <span id="cart-count">0</span>
            </button>

        </nav>
    </header>


    <!-- Hero Section -->
    <section id="home" class="hero">

        <div>
            <h1>Welcome to ShopEasy</h1>

            <p>
                Find the best products at the best prices.
            </p>

            <a href="#products" class="shop-now">
                Shop Now
            </a>
        </div>

    </section>


    <!-- Products -->
    <section id="products" class="products-section">

        <h2>Our Products</h2>

        <div id="product-container" class="product-container">

            <!-- Products will be created by JavaScript -->

        </div>

    </section>


    <!-- Cart -->
    <div id="cart-modal" class="cart-modal">

        <div class="cart-box">

            <button class="close-btn" onclick="closeCart()">
                ×
            </button>

            <h2>Your Cart</h2>

            <div id="cart-items">
                <!-- Cart items appear here -->
            </div>

            <div class="cart-total">
                <h3>
                    Total:
                    ₹<span id="cart-total">0</span>
                </h3>
            </div>

            <button class="checkout-btn" onclick="checkout()">
                Checkout
            </button>

        </div>

    </div>


    <!-- About -->
    <section id="about" class="about">

        <h2>About ShopEasy</h2>

        <p>
            ShopEasy is a demo shopping website created using
            HTML, CSS and JavaScript.
        </p>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 ShopEasy. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
